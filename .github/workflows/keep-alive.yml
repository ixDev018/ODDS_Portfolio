name: Keep Render Alive

on:
  schedule:
    # Trigger every 12 minutes to beat Render's 15-minute inactivity timer
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows testing/running manually from GitHub Actions tab

jobs:
  ping:
    name: Ping Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP ping
        run: |
          # Use repository secret/var if configured, otherwise default URL
          APP_URL="${{ vars.RENDER_APP_URL || secrets.RENDER_APP_URL || 'https://odds-portfolio.onrender.com' }}"
          echo "Pinging ${APP_URL}/up at $(date -u)"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${APP_URL}/up" || true)
          echo "Response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "Service is awake and healthy."
          else
            echo "Fallback ping to root URL..."
            curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${APP_URL}" || true
          fi
